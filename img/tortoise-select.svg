<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f0ea"/>
      <stop offset="100%" stop-color="#b8dcc8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#tbg)"/>
  <!-- Shell -->
  <ellipse cx="200" cy="260" rx="90" ry="65" fill="#3a8a6e"/>
  <ellipse cx="200" cy="250" rx="85" ry="55" fill="#5aaa8e"/>
  <!-- Shell pattern -->
  <path d="M160 235 Q200 200 240 235" fill="none" stroke="#3a8a6e" stroke-width="2.5"/>
  <path d="M150 255 Q200 220 250 255" fill="none" stroke="#3a8a6e" stroke-width="2.5"/>
  <path d="M200 205 L200 270" stroke="#3a8a6e" stroke-width="2"/>
  <path d="M170 215 L175 268" stroke="#3a8a6e" stroke-width="1.5"/>
  <path d="M230 215 L225 268" stroke="#3a8a6e" stroke-width="1.5"/>
  <!-- Head -->
  <ellipse cx="290" cy="275" rx="32" ry="28" fill="#6ebb9a"/>
  <!-- Head-neck connection -->
  <ellipse cx="270" cy="278" rx="25" ry="18" fill="#6ebb9a"/>
  <!-- Eyes -->
  <circle cx="300" cy="268" r="8" fill="white"/>
  <circle cx="301" cy="269" r="4" fill="#1a3d2e"/>
  <circle cx="302" cy="267" r="1.5" fill="white"/>
  <!-- Mouth - gentle smile -->
  <path d="M296 285 Q304 292 312 285" fill="none" stroke="#2d6b52" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Front leg -->
  <ellipse cx="280" cy="310" rx="20" ry="10" fill="#6ebb9a"/>
  <!-- Back leg -->
  <ellipse cx="130" cy="308" rx="18" ry="9" fill="#6ebb9a"/>
  <!-- Tail -->
  <ellipse cx="108" cy="275" rx="8" ry="5" fill="#6ebb9a" transform="rotate(-20 108 275)"/>
  <!-- Calliope mini board (hint) -->
  <circle cx="200" cy="245" r="18" fill="none" stroke="#2d6b52" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="200" y="250" text-anchor="middle" font-size="10" fill="#2d6b52" font-family="sans-serif">☆</text>
  <!-- Gentle leaf decoration -->
  <g opacity="0.3" transform="translate(80, 340)">
    <path d="M0 0 Q15 -20 30 0 Q15 -5 0 0Z" fill="#3a8a6e"/>
  </g>
  <g opacity="0.25" transform="translate(300, 350)">
    <path d="M0 0 Q10 -15 20 0 Q10 -4 0 0Z" fill="#3a8a6e"/>
  </g>
</svg>
