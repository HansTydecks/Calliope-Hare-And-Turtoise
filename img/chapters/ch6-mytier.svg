<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad6)"/>
  <!-- Calliope board shape -->
  <circle cx="200" cy="145" r="70" fill="#2d2d2d" opacity="0.12"/>
  <circle cx="200" cy="145" r="55" fill="#3d3d3d" opacity="0.15"/>
  <!-- LED Matrix (5x5) showing a star/personality symbol -->
  <g transform="translate(175,120)">
    <rect x="0" y="0" width="8" height="8" rx="1" fill="#ff9800" opacity="0.3"/>
    <rect x="12" y="0" width="8" height="8" rx="1" fill="#ff9800" opacity="0.9"/>
    <rect x="24" y="0" width="8" height="8" rx="1" fill="#4caf50" opacity="0.3"/>
    <rect x="36" y="0" width="8" height="8" rx="1" fill="#4caf50" opacity="0.9"/>
    <rect x="48" y="0" width="8" height="8" rx="1" fill="#ff9800" opacity="0.3"/>
    <rect x="0" y="12" width="8" height="8" rx="1" fill="#ff9800" opacity="0.9"/>
    <rect x="12" y="12" width="8" height="8" rx="1" fill="#ff9800" opacity="0.9"/>
    <rect x="24" y="12" width="8" height="8" rx="1" fill="#4caf50" opacity="0.9"/>
    <rect x="36" y="12" width="8" height="8" rx="1" fill="#4caf50" opacity="0.9"/>
    <rect x="48" y="12" width="8" height="8" rx="1" fill="#4caf50" opacity="0.9"/>
    <rect x="0" y="24" width="8" height="8" rx="1" fill="#ff9800" opacity="0.3"/>
    <rect x="12" y="24" width="8" height="8" rx="1" fill="#ff9800" opacity="0.9"/>
    <rect x="24" y="24" width="8" height="8" rx="1" fill="#e91e63" opacity="0.9"/>
    <rect x="36" y="24" width="8" height="8" rx="1" fill="#4caf50" opacity="0.9"/>
    <rect x="48" y="24" width="8" height="8" rx="1" fill="#4caf50" opacity="0.3"/>
    <rect x="0" y="36" width="8" height="8" rx="1" fill="#ff9800" opacity="0.9"/>
    <rect x="12" y="36" width="8" height="8" rx="1" fill="#ff9800" opacity="0.9"/>
    <rect x="24" y="36" width="8" height="8" rx="1" fill="#ff9800" opacity="0.9"/>
    <rect x="36" y="36" width="8" height="8" rx="1" fill="#4caf50" opacity="0.9"/>
    <rect x="48" y="36" width="8" height="8" rx="1" fill="#4caf50" opacity="0.9"/>
    <rect x="0" y="48" width="8" height="8" rx="1" fill="#ff9800" opacity="0.3"/>
    <rect x="12" y="48" width="8" height="8" rx="1" fill="#ff9800" opacity="0.9"/>
    <rect x="24" y="48" width="8" height="8" rx="1" fill="#ff9800" opacity="0.3"/>
    <rect x="36" y="48" width="8" height="8" rx="1" fill="#4caf50" opacity="0.9"/>
    <rect x="48" y="48" width="8" height="8" rx="1" fill="#4caf50" opacity="0.3"/>
  </g>
  <!-- Touch pins (left and right) -->
  <circle cx="115" cy="145" r="10" fill="#ff9800" opacity="0.5"/>
  <text x="115" y="149" text-anchor="middle" font-size="9" fill="#fff" font-family="sans-serif">P1</text>
  <circle cx="285" cy="145" r="10" fill="#4caf50" opacity="0.5"/>
  <text x="285" y="149" text-anchor="middle" font-size="9" fill="#fff" font-family="sans-serif">P2</text>
  <!-- Shake indicator (wavy lines) -->
  <g transform="translate(200,85)" opacity="0.5">
    <path d="M-15,-5 Q-10,-12 -5,-5 Q0,2 5,-5 Q10,-12 15,-5" stroke="#e91e63" stroke-width="2" fill="none"/>
    <path d="M-12,-15 Q-7,-22 -2,-15 Q3,-8 8,-15 Q13,-22 18,-15" stroke="#e91e63" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  <!-- Decorative personality icons -->
  <!-- Heart (emotion) -->
  <path d="M80,240 C80,230 95,225 95,235 C95,225 110,230 110,240 C110,255 95,265 95,265 C95,265 80,255 80,240Z" fill="#e91e63" opacity="0.35"/>
  <!-- Gear (integration) -->
  <g transform="translate(200,250)" opacity="0.3">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#555" stroke-width="3"/>
    <rect x="-2" y="-18" width="4" height="8" rx="1" fill="#555"/>
    <rect x="-2" y="10" width="4" height="8" rx="1" fill="#555"/>
    <rect x="-18" y="-2" width="8" height="4" rx="1" fill="#555"/>
    <rect x="10" y="-2" width="8" height="4" rx="1" fill="#555"/>
  </g>
  <!-- Sparkle (uniqueness) -->
  <g transform="translate(310,240)" opacity="0.4">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#ff9800" stroke-width="2"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#ff9800" stroke-width="2"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#ff9800" stroke-width="1.5"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="#ff9800" stroke-width="1.5"/>
  </g>
