<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4e8"/>
      <stop offset="100%" stop-color="#c8e0c8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg5)"/>
  <!-- Gears / motor -->
  <g transform="translate(350, 160)" stroke="#5a8a5a" stroke-width="2" fill="none" opacity="0.6">
    <circle r="30"/>
    <circle r="12"/>
    <!-- Gear teeth hints -->
    <line x1="0" y1="-30" x2="0" y2="-38"/>
    <line x1="26" y1="-15" x2="33" y2="-19"/>
    <line x1="26" y1="15" x2="33" y2="19"/>
    <line x1="0" y1="30" x2="0" y2="38"/>
    <line x1="-26" y1="15" x2="-33" y2="19"/>
    <line x1="-26" y1="-15" x2="-33" y2="-19"/>
  </g>
  <g transform="translate(440, 175)" stroke="#7aaa7a" stroke-width="1.5" fill="none" opacity="0.5">
    <circle r="20"/>
    <circle r="8"/>
    <line x1="0" y1="-20" x2="0" y2="-26"/>
    <line x1="17" y1="-10" x2="22" y2="-13"/>
    <line x1="17" y1="10" x2="22" y2="13"/>
    <line x1="0" y1="20" x2="0" y2="26"/>
    <line x1="-17" y1="10" x2="-22" y2="13"/>
    <line x1="-17" y1="-10" x2="-22" y2="-13"/>
  </g>
  <!-- Motion trail -->
  <g opacity="0.4">
    <path d="M150 230 Q200 200 250 230 Q300 260 350 230 Q400 200 450 230 Q500 260 550 230 Q600 200 650 230" fill="none" stroke="#6a9a6a" stroke-width="2" stroke-dasharray="8 4"/>
  </g>
  <!-- Wheels -->
  <circle cx="250" cy="240" r="18" fill="none" stroke="#5a8a5a" stroke-width="2.5" opacity="0.5"/>
  <circle cx="250" cy="240" r="3" fill="#5a8a5a" opacity="0.5"/>
  <circle cx="550" cy="240" r="18" fill="none" stroke="#5a8a5a" stroke-width="2.5" opacity="0.5"/>
  <circle cx="550" cy="240" r="3" fill="#5a8a5a" opacity="0.5"/>
  <!-- Direction arrow -->
  <path d="M480 140 L530 140" stroke="#4a7a4a" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <polygon points="530,135 542,140 530,145" fill="#4a7a4a" opacity="0.6"/>
  <!-- Text -->
  <text x="400" y="50" text-anchor="middle" font-size="20" fill="#4a7a4a" font-family="Georgia, serif" letter-spacing="3">K A P I T E L  5</text>
  <text x="400" y="78" text-anchor="middle" font-size="14" fill="#6a9a6a" font-family="sans-serif">Bewegen · Motoren</text>
</svg>
