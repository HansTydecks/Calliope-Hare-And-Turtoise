<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8e8f0"/>
      <stop offset="100%" stop-color="#e4cce0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg6)"/>
  <!-- Variable containers -->
  <g transform="translate(220, 140)">
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="none" stroke="#b070a0" stroke-width="2"/>
    <text x="0" y="-38" text-anchor="middle" font-size="12" fill="#a060a0" font-family="monospace">hunger</text>
    <text x="0" y="8" text-anchor="middle" font-size="24" fill="#8a508a" font-family="monospace">42</text>
  </g>
  <g transform="translate(400, 140)">
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="none" stroke="#b070a0" stroke-width="2"/>
    <text x="0" y="-38" text-anchor="middle" font-size="12" fill="#a060a0" font-family="monospace">energie</text>
    <text x="0" y="8" text-anchor="middle" font-size="24" fill="#8a508a" font-family="monospace">78</text>
  </g>
  <g transform="translate(580, 140)">
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="none" stroke="#b070a0" stroke-width="2"/>
    <text x="0" y="-38" text-anchor="middle" font-size="12" fill="#a060a0" font-family="monospace">freude</text>
    <text x="0" y="8" text-anchor="middle" font-size="24" fill="#8a508a" font-family="monospace">95</text>
  </g>
  <!-- Arrows showing change -->
  <g opacity="0.5">
    <path d="M240 200 L240 220 L260 220" stroke="#c080b0" stroke-width="1.5" fill="none" marker-end="none"/>
    <text x="265" y="225" font-size="11" fill="#b070a0" font-family="monospace">+1</text>
    <path d="M420 200 L420 220 L440 220" stroke="#c080b0" stroke-width="1.5" fill="none"/>
    <text x="445" y="225" font-size="11" fill="#b070a0" font-family="monospace">-3</text>
  </g>
  <!-- Heart / emotion indicator -->
  <path d="M395 240 L400 248 L405 240 Q405 234 400 234 Q395 234 395 240Z" fill="#c888b8" opacity="0.4"/>
  <!-- Bar chart hint -->
  <g transform="translate(150, 260)" opacity="0.3">
    <rect x="0" y="-20" width="15" height="20" fill="#b070a0"/>
    <rect x="20" y="-35" width="15" height="35" fill="#9060a0"/>
    <rect x="40" y="-45" width="15" height="45" fill="#8050a0"/>
  </g>
  <!-- Text -->
  <text x="400" y="50" text-anchor="middle" font-size="20" fill="#8a508a" font-family="Georgia, serif" letter-spacing="3">K A P I T E L  6</text>
  <text x="400" y="78" text-anchor="middle" font-size="14" fill="#a870a0" font-family="sans-serif">Gefühle · Variablen</text>
</svg>
