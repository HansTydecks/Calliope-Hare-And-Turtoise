<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6e8"/>
      <stop offset="100%" stop-color="#e8dcc6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg1)"/>
  <!-- Sunrise -->
  <circle cx="400" cy="280" r="100" fill="#f4d9a0" opacity="0.5"/>
  <circle cx="400" cy="260" r="60" fill="#e8c96e" opacity="0.7"/>
  <!-- Rays -->
  <g stroke="#d4a644" stroke-width="2" opacity="0.4">
    <line x1="400" y1="170" x2="400" y2="130"/>
    <line x1="440" y1="180" x2="465" y2="145"/>
    <line x1="360" y1="180" x2="335" y2="145"/>
    <line x1="470" y1="210" x2="510" y2="195"/>
    <line x1="330" y1="210" x2="290" y2="195"/>
  </g>
  <!-- Circuit board lines -->
  <g stroke="#c9b896" stroke-width="1.5" opacity="0.3">
    <line x1="100" y1="250" x2="300" y2="250"/>
    <line x1="300" y1="250" x2="320" y2="230"/>
    <line x1="500" y1="250" x2="700" y2="250"/>
    <line x1="500" y1="250" x2="480" y2="230"/>
  </g>
  <!-- LED dots waking up -->
  <circle cx="200" cy="200" r="5" fill="#c47d2e" opacity="0.3"/>
  <circle cx="300" cy="180" r="6" fill="#c47d2e" opacity="0.55"/>
  <circle cx="400" cy="160" r="8" fill="#c47d2e" opacity="0.8"/>
  <circle cx="500" cy="180" r="6" fill="#3a8a6e" opacity="0.55"/>
  <circle cx="600" cy="200" r="5" fill="#3a8a6e" opacity="0.3"/>
  <!-- Text -->
  <text x="400" y="100" text-anchor="middle" font-size="20" fill="#8a7a5a" font-family="Georgia, serif" letter-spacing="3">K A P I T E L  1</text>
  <text x="400" y="130" text-anchor="middle" font-size="14" fill="#a89878" font-family="sans-serif">Erwachen · Sequenz</text>
</svg>
