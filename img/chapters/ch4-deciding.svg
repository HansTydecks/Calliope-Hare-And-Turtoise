<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f0e8"/>
      <stop offset="100%" stop-color="#e8d8c4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg4)"/>
  <!-- Fork in the road -->
  <path d="M400 280 L400 180" stroke="#b8a080" stroke-width="4" stroke-linecap="round"/>
  <path d="M400 180 L280 80" stroke="#c47d2e" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M400 180 L520 80" stroke="#3a8a6e" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- Diamond (decision) -->
  <polygon points="400,140 430,170 400,200 370,170" fill="none" stroke="#a08060" stroke-width="2.5"/>
  <text x="400" y="175" text-anchor="middle" font-size="14" fill="#a08060" font-family="sans-serif">?</text>
  <!-- Left path label -->
  <text x="260" y="70" text-anchor="middle" font-size="13" fill="#c47d2e" font-family="sans-serif" opacity="0.8">ja</text>
  <!-- Right path label -->
  <text x="540" y="70" text-anchor="middle" font-size="13" fill="#3a8a6e" font-family="sans-serif" opacity="0.8">nein</text>
  <!-- Arrow heads -->
  <polygon points="275,85 265,75 285,78" fill="#c47d2e" opacity="0.7"/>
  <polygon points="525,85 515,78 535,75" fill="#3a8a6e" opacity="0.7"/>
  <!-- Decorative dots along paths -->
  <circle cx="350" cy="150" r="3" fill="#c47d2e" opacity="0.3"/>
  <circle cx="330" cy="130" r="3" fill="#c47d2e" opacity="0.3"/>
  <circle cx="310" cy="110" r="3" fill="#c47d2e" opacity="0.3"/>
  <circle cx="450" cy="150" r="3" fill="#3a8a6e" opacity="0.3"/>
  <circle cx="470" cy="130" r="3" fill="#3a8a6e" opacity="0.3"/>
  <circle cx="490" cy="110" r="3" fill="#3a8a6e" opacity="0.3"/>
  <!-- Text -->
  <text x="400" y="50" text-anchor="middle" font-size="20" fill="#8a7050" font-family="Georgia, serif" letter-spacing="3">K A P I T E L  4</text>
  <text x="400" y="78" text-anchor="middle" font-size="14" fill="#a89070" font-family="sans-serif">Entscheiden · Wenn-Dann</text>
</svg>
