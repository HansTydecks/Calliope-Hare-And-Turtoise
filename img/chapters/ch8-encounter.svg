<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0ede8"/>
      <stop offset="100%" stop-color="#ddd5c8"/>
    </linearGradient>
    <linearGradient id="merge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c47d2e"/>
      <stop offset="50%" stop-color="#8a8a5a"/>
      <stop offset="100%" stop-color="#3a8a6e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg8)"/>
  <!-- Two paths converging -->
  <path d="M150 80 Q250 80 350 160" stroke="#c47d2e" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M150 250 Q250 250 350 170" stroke="#3a8a6e" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
  <!-- Merge point -->
  <circle cx="380" cy="165" r="20" fill="none" stroke="url(#merge)" stroke-width="3"/>
  <!-- Shared path forward -->
  <path d="M400 165 L650 165" stroke="url(#merge)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Hare silhouette (small) -->
  <g transform="translate(160, 60) scale(0.4)" opacity="0.5">
    <ellipse cx="0" cy="0" rx="20" ry="15" fill="#c47d2e"/>
    <ellipse cx="-5" cy="-20" rx="4" ry="14" fill="#c47d2e"/>
    <ellipse cx="5" cy="-20" rx="4" ry="14" fill="#c47d2e"/>
  </g>
  <!-- Tortoise silhouette (small) -->
  <g transform="translate(160, 240) scale(0.4)" opacity="0.5">
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#3a8a6e"/>
    <ellipse cx="0" cy="-5" rx="18" ry="10" fill="#5aaa8e"/>
    <ellipse cx="20" cy="5" rx="8" ry="5" fill="#6ebb9a"/>
  </g>
  <!-- Stars at meeting point -->
  <g opacity="0.6">
    <text x="380" y="128" text-anchor="middle" font-size="18" fill="#c4a040">✦</text>
    <text x="365" y="148" text-anchor="middle" font-size="12" fill="#c4a040">✦</text>
    <text x="395" y="145" text-anchor="middle" font-size="12" fill="#c4a040">✦</text>
  </g>
  <!-- Calliope at the end -->
  <circle cx="650" cy="165" r="22" fill="none" stroke="#a09070" stroke-width="2"/>
  <text x="650" y="170" text-anchor="middle" font-size="14" fill="#8a7a60">★</text>
  <!-- Text -->
  <text x="400" y="45" text-anchor="middle" font-size="20" fill="#7a6a4a" font-family="Georgia, serif" letter-spacing="3">K A P I T E L  8</text>
  <text x="400" y="73" text-anchor="middle" font-size="14" fill="#9a8a6a" font-family="sans-serif">Begegnung · Zusammenführung</text>
</svg>
