<!DOCTYPE html>
<html lang="de" data-theme="neutral">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hase & Schildkröte — Eine algorithmische Reise</title>
  <meta name="description" content="Lerne Programmieren mit dem Calliope mini. Wähle deine Geschichte: Der Hase oder die Schildkröte.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ============================================ -->
  <!-- TOP BAR: Language, LRS, Progress             -->
  <!-- ============================================ -->
  <header class="top-bar" id="topBar">
    <div class="top-bar__left">
      <button class="btn-icon btn-lrs" id="btnLRS" title="Leseunterstützung aktivieren" aria-label="Leseunterstützung">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        <span class="btn-lrs__label" data-i18n="lrs">LRS</span>
      </button>
    </div>
    <div class="top-bar__center">
      <div class="progress-bar" id="progressBar" aria-label="Fortschritt">
        <div class="progress-bar__fill" id="progressFill" style="width: 0%"></div>
        <span class="progress-bar__text" id="progressText">0 / 8</span>
      </div>
    </div>
    <div class="top-bar__right">
      <div class="lang-selector" id="langSelector">
        <button class="btn-lang active" data-lang="de" title="Deutsch">DE</button>
        <button class="btn-lang" data-lang="en" title="English">EN</button>
        <button class="btn-lang" data-lang="uk" title="Українська">UK</button>
        <button class="btn-lang" data-lang="fr" title="Français">FR</button>
        <button class="btn-lang" data-lang="es" title="Español">ES</button>
      </div>
    </div>
  </header>

  <!-- ============================================ -->
  <!-- LANDING PAGE: Story Selection                -->
  <!-- ============================================ -->
  <main class="landing" id="landing">
    <div class="landing__content">
      <h1 class="landing__title" data-i18n="siteTitle">Hase &amp; Schildkröte</h1>
      <p class="landing__subtitle" data-i18n="siteSubtitle">Eine algorithmische Reise mit dem Calliope mini</p>

      <div class="landing__intro">
        <p data-i18n="landingIntro">
          Zwei Tiere. Zwei Geschichten. Ein gemeinsamer Weg.<br>
          Wähle dein Tier — und erwecke es zum Leben.
        </p>
      </div>

      <div class="story-choice">
        <button class="story-card story-card--hare" id="chooseHare" aria-label="Geschichte des Hasen wählen">
          <div class="story-card__image">
            <img src="img/hare-select.svg" alt="Der Hase" loading="lazy">
          </div>
          <h2 class="story-card__name" data-i18n="hareName">Der Hase</h2>
          <p class="story-card__desc" data-i18n="hareDesc">Schnell, neugierig, ungeduldig.<br>Er lernt, dass Geschwindigkeit nicht alles ist.</p>
        </button>

        <div class="story-choice__divider">
          <span data-i18n="or">oder</span>
        </div>

        <button class="story-card story-card--tortoise" id="chooseTortoise" aria-label="Geschichte der Schildkröte wählen">
          <div class="story-card__image">
            <img src="img/tortoise-select.svg" alt="Die Schildkröte" loading="lazy">
          </div>
          <h2 class="story-card__name" data-i18n="tortoiseName">Die Schildkröte</h2>
          <p class="story-card__desc" data-i18n="tortoiseDesc">Ruhig, bedacht, beharrlich.<br>Sie entdeckt, dass Langsamkeit eine Stärke ist.</p>
        </button>
      </div>

      <div class="hardware-toggle">
        <label class="hardware-toggle__label" for="hardwareCheckbox">
          <input type="checkbox" id="hardwareCheckbox" class="hardware-toggle__input">
          <span class="hardware-toggle__switch"></span>
          <span class="hardware-toggle__text" data-i18n="hardwareLabel">Ich besitze die nötige Hardware (Calliope mini + Motoren + Sensoren)</span>
        </label>
      </div>
    </div>
  </main>

  <!-- ============================================ -->
  <!-- READING VIEW: Sidebar + Chapter Content      -->
  <!-- ============================================ -->
  <div class="reading-view" id="readingView" hidden>

    <!-- Sidebar: Book Spine Navigation -->
    <nav class="sidebar" id="sidebar" aria-label="Kapitelnavigation">
      <button class="sidebar__toggle" id="sidebarToggle" aria-label="Menü öffnen/schließen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <div class="sidebar__header">
        <button class="sidebar__back" id="btnBackToSelection" aria-label="Zurück zur Auswahl">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span data-i18n="backToSelection">Zurück</span>
        </button>
        <div class="sidebar__animal" id="sidebarAnimal">
          <img id="sidebarAnimalImg" src="" alt="">
          <span id="sidebarAnimalName"></span>
        </div>
      </div>

      <ol class="chapter-list" id="chapterList">
        <!-- Filled dynamically by app.js -->
      </ol>
    </nav>

    <!-- Main Content Area -->
    <article class="chapter-content" id="chapterContent">

      <!-- Chapter Header -->
      <header class="chapter-header">
        <div class="chapter-header__image" id="chapterImage">
          <img id="chapterImg" src="" alt="" loading="lazy">
        </div>
        <div class="chapter-header__text">
          <span class="chapter-header__number" id="chapterNumber"></span>
          <h1 class="chapter-header__title" id="chapterTitle"></h1>
          <p class="chapter-header__concept" id="chapterConcept"></p>
        </div>
      </header>

      <!-- Narrative Section -->
      <section class="chapter-section narrative" id="sectionNarrative">
        <div class="narrative__text" id="narrativeText"></div>
      </section>

      <!-- Problem Section -->
      <section class="chapter-section problem" id="sectionProblem">
        <h2 class="section-title" data-i18n="problemTitle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Das Problem
        </h2>
        <div id="problemText"></div>
      </section>

      <!-- Informatik-Idee Section -->
      <section class="chapter-section concept-explanation" id="sectionConcept">
        <h2 class="section-title" data-i18n="conceptTitle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          Die Informatik-Idee
        </h2>
        <div id="conceptText"></div>
      </section>

      <!-- Guided Task (Calliope Markdown Style) -->
      <section class="chapter-section guided-task" id="sectionGuidedTask">
        <h2 class="section-title" data-i18n="guidedTaskTitle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Geführte Aufgabe
        </h2>
        <div class="guided-task__container" id="guidedTaskContent"></div>
      </section>

      <!-- Open Tasks -->
      <section class="chapter-section open-tasks" id="sectionOpenTasks">
        <h2 class="section-title" data-i18n="openTasksTitle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Aufgaben
        </h2>
        <div id="openTasksContent"></div>
      </section>

      <!-- Extension Tasks -->
      <section class="chapter-section extension-tasks" id="sectionExtension">
        <h2 class="section-title" data-i18n="extensionTitle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          Was wäre, wenn…?
        </h2>
        <div id="extensionContent"></div>
      </section>

      <!-- Chapter Navigation -->
      <footer class="chapter-nav">
        <button class="btn-chapter-nav btn-prev" id="btnPrevChapter" aria-label="Vorheriges Kapitel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span data-i18n="prevChapter">Vorheriges Kapitel</span>
        </button>
        <button class="btn-chapter-nav btn-next" id="btnNextChapter" aria-label="Nächstes Kapitel">
          <span data-i18n="nextChapter">Nächstes Kapitel</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </footer>

    </article>
  </div>

  <!-- ============================================ -->
  <!-- SCRIPTS                                      -->
  <!-- ============================================ -->
  <script src="js/content-de.js"></script>
  <script src="js/content-en.js"></script>
  <script src="js/content-translations.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
